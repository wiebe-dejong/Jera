<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Cockpit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; }
  .c-accent { fill:var(--accent); } .c-ink { fill:var(--ink); } .c-warn { fill:var(--warn); } .c-bad { fill:var(--bad); } .c-relief { fill:var(--line-strong); } .c-dot { fill:var(--mute); }
  .blk { rx:var(--hoek); }
  .words { position:absolute; left:36px; bottom:32px; max-width:440px; }
  .name { margin:0; font:700 96px/.95 var(--font-mono); letter-spacing:-.04em; color:var(--ink); }
  .tag { margin:12px 0 0 4px; font:400 13px/1.3 var(--font-mono); color:var(--mute); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 208x182, line-strong 220x104, warn 130x78, bad 52x52, ink 104x106: zijden in veelvouden van h-rij (26px)
  arrangement een sluitend raster dat rechts en boven uit beeld loopt, zoals de panelen van het venster tegen elkaar liggen
  pattern     stippenraster op 26px (h-rij): precies, technisch, mono; "alles is recht, een lijn van 1 px"
  scales      h-rij 26px als pitch en als maat van de blokken, hoek 0px
-->
<rect class="blk c-accent" x="52" y="0" width="208" height="182"/>
<rect class="blk c-relief" x="260" y="0" width="220" height="104"/>
<rect class="blk c-warn" x="260" y="104" width="130" height="78"/>
<rect class="blk c-bad" x="390" y="104" width="52" height="52"/>
<rect class="blk c-ink" x="52" y="182" width="104" height="106"/>
<g class="c-dot"><circle cx="182" cy="208" r="1.6"/><circle cx="208" cy="208" r="1.6"/><circle cx="234" cy="208" r="1.6"/><circle cx="260" cy="208" r="1.6"/><circle cx="286" cy="208" r="1.6"/><circle cx="312" cy="208" r="1.6"/><circle cx="338" cy="208" r="1.6"/><circle cx="364" cy="208" r="1.6"/><circle cx="390" cy="208" r="1.6"/><circle cx="416" cy="208" r="1.6"/><circle cx="442" cy="208" r="1.6"/><circle cx="468" cy="208" r="1.6"/><circle cx="182" cy="234" r="1.6"/><circle cx="208" cy="234" r="1.6"/><circle cx="234" cy="234" r="1.6"/><circle cx="260" cy="234" r="1.6"/><circle cx="286" cy="234" r="1.6"/><circle cx="312" cy="234" r="1.6"/><circle cx="338" cy="234" r="1.6"/><circle cx="364" cy="234" r="1.6"/><circle cx="390" cy="234" r="1.6"/><circle cx="416" cy="234" r="1.6"/><circle cx="442" cy="234" r="1.6"/><circle cx="468" cy="234" r="1.6"/><circle cx="182" cy="260" r="1.6"/><circle cx="208" cy="260" r="1.6"/><circle cx="234" cy="260" r="1.6"/><circle cx="260" cy="260" r="1.6"/><circle cx="286" cy="260" r="1.6"/><circle cx="312" cy="260" r="1.6"/><circle cx="338" cy="260" r="1.6"/><circle cx="364" cy="260" r="1.6"/><circle cx="390" cy="260" r="1.6"/><circle cx="416" cy="260" r="1.6"/><circle cx="442" cy="260" r="1.6"/><circle cx="468" cy="260" r="1.6"/></g>
</svg>
</div>
<div class="words">
<h1 class="name">Cockpit</h1>
<p class="tag">Claude Code-sessies draaien en overzien.</p>
</div>
</div>
</body>
</html>
